
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow AI Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f1020;
            color: white;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #17182d;
            padding: 24px;
            border-radius: 16px;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
        }
        button {
            background: #6366f1;
            color: white;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .answer { white-space: pre-wrap; line-height: 1.6; }
        a { color: #a5b4fc; }
    </style>
</head>
<body>
    <a href="/">← Back to Dashboard</a>
    <h1>🤖 AI Study Assistant</h1>
    <p><a href="{{ url_for('ai_history') }}">📚 View Chat History</a></p>
    <p>Ask questions about your studies and get AI-powered help.</p>

    <div class="card">
        <form method="POST" action="/ai-assistant">
            <label for="question">Your study question</label>
            <textarea id="question" name="question" rows="4"
                placeholder="Ask a question..." required>{{ question }}</textarea>
            <button type="submit">Ask AI</button>
        </form>
    </div>

    {% if answer %}
    <div class="card">
        <h2>AI Response</h2>
        <div class="answer">{{ answer }}</div>
    </div>
    {% endif %}
</body>
</html>
